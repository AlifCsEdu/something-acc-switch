[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccx-switcher"
version = "1.0.0"
description = "Modern Codex auth.json profile switcher (CLI + TUI)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{ name = "Alif" }]

dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
tui = ["textual>=0.70"]

[project.scripts]
ccx = "ccx.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
